name: Build Homeserver

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NixOS (aarch64-linux)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          rm_cmd: "rmz"
 
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: goldmensch-homeserver
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build homeserver configuration
        run: |
          nix build \
            .#nixosConfigurations.homeserver.config.system.build.toplevel \
            --log-level info

